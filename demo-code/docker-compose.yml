version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: enaya
      POSTGRES_USER: enaya
      POSTGRES_PASSWORD: enaya
    ports:
      - "127.0.0.1:5430:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://enaya:enaya@db:5432/enaya?schema=public
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY}
    depends_on:
      - db
    # Backend is internal only, accessed via Nginx proxy
    ports:
      - "127.0.0.1:2988:2988" 
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "81:80" # Exposed to the world
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
