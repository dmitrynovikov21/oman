version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: expertos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expertos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Frontend
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expertos-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/expertos
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=change_in_production
    ports:
      - "3000:3000"
  # Python OCR Backend (optional - run if needed)
  # ocr:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile.python
  #   container_name: expertos-ocr
  #   volumes:
  #     - ./uploads:/app/uploads
  #   ports:
  #     - "8000:8000"

volumes:
  postgres_data:
